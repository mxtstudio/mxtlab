name: Project quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static site and MCP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dept-os-mcp/package-lock.json

      - name: Pin npm version for reproducible lockfile resolution
        run: npm install --global npm@11.6.2

      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Validate per-page lesson module loading
        run: node scripts/validate-lesson-loading.mjs

      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"

      - name: Validate Supabase migration filenames against the live ledger snapshot
        run: node supabase/validate-migrations.mjs

      - name: Regenerate dependency lock from package metadata
        working-directory: dept-os-mcp
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install MCP dependencies from generated lock
        working-directory: dept-os-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run MCP regression tests
        working-directory: dept-os-mcp
        run: npm test

      - name: Audit all MCP dependencies
        working-directory: dept-os-mcp
        run: npm audit --audit-level=high
