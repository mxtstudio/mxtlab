<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply for Teacher Access – MXT Lab</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script type="module" src="/assets/js/auth.js"></script>
  <script type="module" src="/assets/js/apply-teacher.js"></script>
</head>
<body>
  <nav id="navbar"> <!-- simplified copy of main nav -->
    <div class="nav-wrap">
      <a class="nav-logo" href="/">
        <svg class="logo-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect id="logo-bg" width="28" height="28" rx="7" fill="#3a7d2c"/></svg>
        MXT<span id="lab-text">Lab</span>
        <span class="nav-badge">Agriculture</span>
      </a>
      <ul class="nav-links">
        <li><a href="/about.html">About</a></li>
        <li><a href="/resources.html">Resources</a></li>
        <li><a href="/quiz.html">Quiz Hub</a></li>
        <li id="nav-apply-teacher" style="display:none"><a href="/apply-teacher.html">Apply for Teacher Access</a></li>
      </ul>
      <div class="nav-right">
        <button class="nav-icon-btn" id="google-signin" aria-label="Sign in with Google">Sign in</button>
        <div id="profile-badge" class="profile-badge" style="display:none"><img id="profile-avatar" alt="" /><span id="profile-name"></span></div>
      </div>
    </div>
  </nav>

  <main class="page active" style="max-width:800px;margin:auto;padding:20px;">
    <h1>Apply for Teacher Access</h1>
    <p>Please fill out the form below. Your application will be reviewed by MXT Lab administrators.</p>
    <form id="teacher-application-form">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="phone">Contact Number</label>
        <input type="tel" id="phone" name="phone" required />
      </div>
      <div class="form-group">
        <label for="school">School / Institution</label>
        <input type="text" id="school" name="school" required />
      </div>
      <div class="form-group">
        <label for="province">Province</label>
        <input type="text" id="province" name="province" required />
      </div>
      <div class="form-group">
        <label for="district">District</label>
        <input type="text" id="district" name="district" required />
      </div>
      <div class="form-group">
        <label for="position">Teaching Position</label>
        <input type="text" id="position" name="position" required />
      </div>
      <div class="form-group">
        <label for="subjects">Subjects Taught (comma separated)</label>
        <input type="text" id="subjects" name="subjects" required />
      </div>
      <div class="form-group">
        <label for="experience">Years of Teaching Experience</label>
        <input type="number" id="experience" name="experience" min="0" required />
      </div>
      <div class="form-group">
        <label for="documents">Supporting Documents (PDF/JPG/PNG, max 5 MB each)</label>
        <input type="file" id="documents" name="documents" accept=".pdf,.jpg,.jpeg,.png" multiple required />
      </div>
      <button type="submit" class="btn btn-primary">Submit Application</button>
    </form>
    <div id="form-status" style="margin-top:1rem;color:var(--green);"></div>
  </main>
</body>
</html>
